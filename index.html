<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de IMC</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 20px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);

            text-align: center;
        }

        .icone {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            color: #333;
            margin-bottom: 8px;
        }

        .subtitulo {
            color: #777;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .campo {
            text-align: left;
            margin-bottom: 20px;
        }

        .campo label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        .campo input {
            width: 100%;
            padding: 14px;

            border: 2px solid #e0e0e0;
            border-radius: 10px;

            font-size: 16px;

            outline: none;

            transition: 0.3s;
        }

        .campo input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        button {
            width: 100%;
            padding: 15px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        #resultado {
            margin-top: 25px;
            padding: 20px;

            border-radius: 12px;

            background: #f5f6ff;

            color: #333;

            display: none;
        }

        #resultado.mostrar {
            display: block;
        }

        .valor-imc {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;

            margin: 8px 0;
        }

        .classificacao {
            font-size: 17px;
            font-weight: bold;
        }

        .rodape {
            margin-top: 25px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="icone">⚖️</div>

            <h1>Calculadora de IMC</h1>

            <p class="subtitulo">
                Descubra seu Índice de Massa Corporal
            </p>

            <form id="formulario">

                <div class="campo">
                    <label for="peso">Peso (kg)</label>

                    <input
                        type="number"
                        id="peso"
                        placeholder="Ex: 70"
                        step="0.01"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="altura">Altura (m)</label>

                    <input
                        type="number"
                        id="altura"
                        placeholder="Ex: 1.75"
                        step="0.01"
                        required
                    >
                </div>

                <button type="submit">
                    Calcular IMC
                </button>

            </form>

            <div id="resultado"></div>

            <p class="rodape">
                Calculadora de IMC • Projeto JavaScript
            </p>

        </div>

    </div>

    <script src="mainjs/main.js"></script>

</body>

</html>
